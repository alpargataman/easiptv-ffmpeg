name: Build decoder

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          # yes dies of SIGPIPE when sdkmanager exits; that is not an error.
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      - name: Build
        shell: bash
        run: ./build-decoder.sh

      - name: Check that FFmpeg is LGPL-only
        shell: bash
        run: |
          set -euo pipefail
          for header in build/config-*.h; do
            grep -qx '#define CONFIG_GPL 0' "$header"
            grep -qx '#define CONFIG_NONFREE 0' "$header"
            grep -qx '#define CONFIG_VERSION3 0' "$header"
            if grep '^#define FFMPEG_CONFIGURATION ' "$header" | grep -qE -- '--enable-(gpl|nonfree|version3)'; then
              echo "$header enables a GPL/nonfree/version3 option" >&2
              exit 1
            fi
          done

      - name: Compare with the committed release checksums
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          reference="releases/app-${APP_VERSION}-${BUILD_NUMBER}/SHA256SUMS"
          if [[ ! -f "$reference" ]]; then
            echo "No committed checksums for app-${APP_VERSION}-${BUILD_NUMBER} yet; skipping."
            exit 0
          fi
          bash scripts/verify-checksums.sh "$reference"

      - name: Compare with the release assets
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/published
          gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" \
            --pattern SHA256SUMS --dir build/published
          bash scripts/verify-checksums.sh build/published/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: easiptv-ffmpeg-dist
          path: dist/
          retention-days: 30
